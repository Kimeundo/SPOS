<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>휘연당 랜딩</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3560}a:hover{color:#1C2340}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F5F0E4; color: #1C2340; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <section style="position: relative; background-color: #161C36; background-image: radial-gradient(circle at 10% 20%, rgba(232, 205, 140, 0.9) 0 1.2px, transparent 2px), radial-gradient(circle at 86% 14%, rgba(232, 205, 140, 0.8) 0 1px, transparent 2px), radial-gradient(circle at 50% 8%, rgba(232, 205, 140, 0.7) 0 1px, transparent 2px), radial-gradient(ellipse at 50% 60%, #2A3463 0%, #161C36 72%); color: #F5F0E4; border-radius: 0 0 30px 30px; padding-bottom: 22px;">
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px;">
      <span style="font-family: 'Song Myung', serif; font-size: 24px; letter-spacing: 0.06em; color: #E8CD8C;">휘연당</span>
      <a href="Daily.dc.html" style="font-size: 14px; text-decoration: none; padding: 10px 4px; color: #F5F0E4;">로그인</a>
    </header>

    <div style="position: relative; height: 236px;">
      <svg width="390" height="236" viewBox="0 0 390 236" style="position: absolute; left: 0; top: 0;" aria-hidden="true">
        <g stroke="#C8A24C" stroke-opacity="0.5" stroke-width="0.8" fill="none"><path d="M24 40 L60 22 L92 48"></path><path d="M300 30 L336 18 L366 50 L352 84"></path></g>
        <g fill="#E8CD8C"><circle cx="24" cy="40" r="2"></circle><circle cx="60" cy="22" r="2.4"></circle><circle cx="92" cy="48" r="1.8"></circle><circle cx="300" cy="30" r="2"></circle><circle cx="336" cy="18" r="2.4"></circle><circle cx="366" cy="50" r="1.8"></circle><circle cx="352" cy="84" r="2"></circle></g>
      </svg>
      <img src="../assets/characters/hwi-poses/01-greet.webp" alt="인사하는 서휘" style="position: absolute; left: 26px; top: 18px; width: 178px; height: 178px; filter: drop-shadow(0 0 22px rgba(232, 205, 140, 0.45)); animation: bob 4s ease-in-out infinite;">
      <img src="../assets/characters/yeon/yeon-moon.webp" alt="부채를 든 하연" style="position: absolute; right: 26px; top: 46px; width: 170px; height: 170px; filter: drop-shadow(0 0 22px rgba(232, 205, 140, 0.45)); animation: bob 4s ease-in-out 1.2s infinite;">
      <span style="position: absolute; left: 82px; top: 196px; font-family: 'Song Myung', serif; font-size: 15px; color: #E8CD8C;">서휘</span>
      <span style="position: absolute; right: 86px; top: 216px; font-family: 'Song Myung', serif; font-size: 15px; color: #E8CD8C;">하연</span>
      <span style="position: absolute; left: 168px; top: 30px; font-size: 18px; color: #E8CD8C; animation: twinkle 2.4s ease-in-out infinite;" aria-hidden="true">✦</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 22px 0;">
      <h1 style="margin: 0; font-family: 'Song Myung', serif; font-weight: 400; font-size: 29px; line-height: 1.3;">두 사람이 같이 봐주는<br>당신의 사주</h1>
      <p style="margin: 0; font-size: 14.5px; line-height: 1.6; color: #C9CCDA;">생년월일시만 알려주면 일간 카드와 두 사람의 풀이를 드려요. 가입 없이 무료.</p>
    </div>
  </section>

  <main style="display: flex; flex-direction: column; gap: 16px; padding: 18px 20px 12px; flex-grow: 1;">
    <a href="Input.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #D4AF5A; color: #161C36; text-decoration: none; font-size: 16.5px; font-weight: 700; box-shadow: 0 6px 16px rgba(184, 145, 58, 0.35);">무료로 내 사주 보기</a>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h2 style="margin: 0; font-size: 15px; font-weight: 700;">요즘 뭐가 제일 궁금해요?</h2>
        <span style="font-size: 12px; color: #5B6178;">고르면 그 이야기부터 해줄게</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
        <sc-for list="{{ topics }}" as="t" hint-placeholder-count="6">
          <a href="Input.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 10px; border-radius: 16px; background: #FFFCF5; border: 1px solid #E2D9C4; text-decoration: none; color: #1C2340;">
            <img src="{{ t.src }}" alt="" style="width: 78px; height: 78px;">
            <b style="font-size: 13.5px;">{{ t.label }}</b>
            <span style="font-size: 11px; color: #5B6178;">{{ t.sub }}</span>
          </a>
        </sc-for>
      </div>
    </div>
  </main>

  <footer style="padding: 6px 20px 14px; font-size: 11.5px; color: #5B6178; line-height: 1.5; text-align: center;">
    오락 및 참고용 서비스입니다. 풀이 문장과 캐릭터 이미지에는 AI 생성 콘텐츠가 포함됩니다.
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      topics: [
        { label: '재물운', sub: '돈이 들어올 때', src: '../assets/characters/hwi-poses/09-gold.webp' },
        { label: '연애운', sub: '설렘이 올까', src: '../assets/characters/hwi-poses/11-heart.webp' },
        { label: '인연·궁합', sub: '붉은 실 찾기', src: '../assets/characters/hwi-poses/12-thread.webp' },
        { label: '일·이직', sub: '옮길 타이밍', src: '../assets/characters/hwi-poses/13-career.webp' },
        { label: '시험·합격', sub: '붙을 운', src: '../assets/characters/hwi-poses/15-diploma.webp' },
        { label: '좋은 날', sub: '날짜 잡기', src: '../assets/characters/hwi-poses/17-calendar.webp' }
      ]
    };
  }
}
</script>
</body>
</html>
