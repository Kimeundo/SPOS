<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>일간 캐릭터 카드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3560}a:hover{color:#1C2340}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F0E4; color: #1C2340; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 8px; padding: 10px 12px;">
    <a href="Input.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 16px; font-weight: 600; flex-grow: 1;">나의 일간 카드</span>
    <span style="font-size: 11px; padding: 3px 9px; border-radius: 99px; background: #F3E3BC; color: #6A4A0E; margin-right: 8px;">예시 결과</span>
  </header>

  <main style="display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 20px;">
    <section style="position: relative; overflow: hidden; border-radius: 22px; border: 1.5px solid #C8A24C; background-color: #161C36; background-image: radial-gradient(circle at 18% 12%, rgba(232, 205, 140, 0.9) 0 1.2px, transparent 2px), radial-gradient(circle at 72% 20%, rgba(232, 205, 140, 0.7) 0 1px, transparent 2px), radial-gradient(circle at 40% 58%, rgba(232, 205, 140, 0.6) 0 1px, transparent 2px), radial-gradient(ellipse at 80% 100%, #2C3A6B 0%, #161C36 65%); color: #F5F0E4; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 470px; box-sizing: border-box;">
      <img src="../assets/characters/hwi-poses/04-present.webp" alt="" aria-hidden="true" style="position: absolute; right: -18px; bottom: -14px; width: 168px; height: 168px; filter: drop-shadow(0 0 22px rgba(232, 205, 140, 0.4));">
      <div style="display: flex; justify-content: space-between; align-items: center; position: relative;">
        <span style="font-size: 11.5px; letter-spacing: 0.16em; color: #E8CD8C;">휘연당 일간 카드</span>
        <span style="font-family: 'Song Myung', serif; font-size: 14px; color: #E8CD8C;">暉蓮堂</span>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; position: relative;">
        <div style="width: 88px; height: 88px; border: 2.5px solid #E8CD8C; color: #E8CD8C; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Song Myung', serif; font-size: 50px; flex-shrink: 0; background: rgba(200, 162, 76, 0.08);">甲</div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 13px; color: #C9CCDA;">갑목 · 양의 나무</span>
          <h1 style="margin: 0; font-family: 'Song Myung', serif; font-weight: 400; font-size: 26px; line-height: 1.25;">곧게 자라는<br>큰 나무</h1>
        </div>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap; position: relative;">
        <span style="font-size: 12.5px; padding: 4px 11px; border-radius: 99px; border: 1px solid #4E5888;">직진형</span>
        <span style="font-size: 12.5px; padding: 4px 11px; border-radius: 99px; border: 1px solid #4E5888;">책임감</span>
        <span style="font-size: 12.5px; padding: 4px 11px; border-radius: 99px; border: 1px solid #4E5888;">내 사람은 끝까지</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px; position: relative; width: 210px;">
        <span style="font-size: 12px; color: #C9CCDA;">오행 분포 (여덟 글자 기준)</span>
        <sc-for list="{{ elements }}" as="el" hint-placeholder-count="5">
          <div style="display: grid; grid-template-columns: 22px minmax(0, 1fr) 14px; gap: 8px; align-items: center; font-size: 13px;">
            <span>{{ el.name }}</span>
            <div style="height: 7px; border-radius: 4px; background: #2E3760;"><div style="{{ el.barStyle }}"></div></div>
            <span style="color: #C9CCDA;">{{ el.n }}</span>
          </div>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #E1E3EC; position: relative; width: 200px;">휘: "방향을 한번 정하면 곧게 올라가는 타입."</p>
    </section>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #D8CDB4; background: #FFFCF5; font: inherit; font-size: 14px; color: #1C2340; cursor: pointer;">이미지 저장</button>
      <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #D8CDB4; background: #FFFCF5; font: inherit; font-size: 14px; color: #1C2340; cursor: pointer;">친구에게 공유</button>
    </div>

    <a href="Reading.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #D4AF5A; color: #161C36; text-decoration: none; font-size: 16.5px; font-weight: 700;">두 사람의 풀이 듣기</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { name: '목', n: 3, color: '#7FC497' },
      { name: '화', n: 2, color: '#EE8A6E' },
      { name: '토', n: 1, color: '#E8CD8C' },
      { name: '금', n: 1, color: '#C9CCDA' },
      { name: '수', n: 1, color: '#7FA8DA' }
    ];
    return {
      elements: raw.map((e) => ({
        name: e.name,
        n: e.n,
        barStyle: 'height: 7px; border-radius: 4px; background: ' + e.color + '; width: ' + (e.n * 25) + '%;'
      }))
    };
  }
}
</script>
</body>
</html>
