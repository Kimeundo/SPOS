<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>미니 풀이 (캐릭터 연출)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3560}a:hover{color:#1C2340}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #161C36; color: #1C2340; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <header style="display: flex; align-items: center; gap: 6px; padding: 8px 10px; color: #F5F0E4; position: relative; z-index: 3;">
    <a href="Card.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F5F0E4;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; flex-grow: 1;">
      <span style="font-size: 15.5px; font-weight: 600;">미니 풀이</span>
      <span style="font-size: 12px; color: #E8CD8C;">일간 갑목 · 2026 병오년</span>
    </div>
    <span style="font-size: 12.5px; color: #C9CCDA; padding-right: 8px;">{{ progress }}</span>
  </header>

  <section style="position: relative; height: 430px; flex-shrink: 0; background-image: radial-gradient(circle at 12% 30%, rgba(232, 205, 140, 0.9) 0 1.2px, transparent 2px), radial-gradient(circle at 88% 18%, rgba(232, 205, 140, 0.8) 0 1px, transparent 2px), radial-gradient(circle at 70% 52%, rgba(232, 205, 140, 0.5) 0 1px, transparent 2px), radial-gradient(ellipse at 50% 95%, #33427A 0%, #161C36 68%);">

    <div style="position: absolute; left: 50%; top: 4px; transform: translateX(-50%); width: 300px; min-height: 140px; box-sizing: border-box; padding: 14px 16px; border-radius: 16px; background: rgba(255, 252, 245, 0.97); border: 1.5px solid #C8A24C; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; z-index: 2; text-align: center;">
      <span style="font-size: 11px; letter-spacing: 0.16em; color: #8A6A1E; font-weight: 600;">{{ boardTitle }}</span>

      <sc-if value="{{ isSeal }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; gap: 14px;">
          <div style="width: 70px; height: 70px; border-radius: 50%; border: 2.5px solid #3F7D4E; color: #3F7D4E; display: flex; align-items: center; justify-content: center; font-family: 'Song Myung', serif; font-size: 42px;">甲</div>
          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px;">
            <b style="font-family: 'Song Myung', serif; font-weight: 400; font-size: 22px;">갑목</b>
            <span style="font-size: 13px; color: #5B6178;">양(陽)의 나무 · 큰 나무</span>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isChips }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;">
          <span style="font-size: 14px; padding: 6px 12px; border-radius: 99px; background: #232B4D; color: #F5F0E4;">직진형</span>
          <span style="font-size: 14px; padding: 6px 12px; border-radius: 99px; background: #232B4D; color: #F5F0E4;">굽히지 않음</span>
          <span style="font-size: 14px; padding: 6px 12px; border-radius: 99px; background: #2C6866; color: #F5F0E4;">내 사람은 끝까지</span>
        </div>
      </sc-if>

      <sc-if value="{{ isFlow }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 54px; height: 54px; border-radius: 50%; border: 2px solid #3F7D4E; color: #3F7D4E; display: flex; align-items: center; justify-content: center; font-family: 'Song Myung', serif; font-size: 32px;">甲</div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: #5B6178;">
            <span>목생화(木生火)</span>
            <svg width="70" height="14" viewBox="0 0 70 14" aria-hidden="true"><path d="M2 7 H62" stroke="#C8A24C" stroke-width="2" fill="none"></path><path d="M58 2 L66 7 L58 12" stroke="#C8A24C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </div>
          <div style="width: 54px; height: 54px; border-radius: 50%; border: 2px solid #C2412F; color: #C2412F; display: flex; align-items: center; justify-content: center; font-family: 'Song Myung', serif; font-size: 32px;">丙</div>
        </div>
        <span style="font-size: 13px;"><b>식신</b> · 내가 생(生)하는, 음양이 같은 기운</span>
      </sc-if>

      <sc-if value="{{ isMeaning }}" hint-placeholder-val="{{ false }}">
        <b style="font-family: 'Song Myung', serif; font-weight: 400; font-size: 24px;">식신 = 밖으로 나오는 힘</b>
        <div style="display: flex; gap: 6px;">
          <span style="font-size: 13px; padding: 4px 10px; border-radius: 99px; border: 1px solid #D8CDB4;">말</span>
          <span style="font-size: 13px; padding: 4px 10px; border-radius: 99px; border: 1px solid #D8CDB4;">창작</span>
          <span style="font-size: 13px; padding: 4px 10px; border-radius: 99px; border: 1px solid #D8CDB4;">새로운 시작</span>
        </div>
      </sc-if>

      <sc-if value="{{ isAction }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: #F3E3BC;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6A4A0E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M8 12l3 3 5-6"></path></svg>
          <span style="font-size: 15px; font-weight: 600; color: #5A3E0B;">이번 달, 작게 하나 시작하기</span>
        </div>
      </sc-if>

      <sc-if value="{{ isLock }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8A6A1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          <span style="font-size: 14px; color: #8A8F99; filter: blur(3.5px);" aria-hidden="true">하반기 흐름이 원국과 만나면서 생기는 변화</span>
        </div>
      </sc-if>
    </div>

    <svg width="300" height="40" viewBox="0 0 300 40" style="{{ pointerStyle }}" aria-hidden="true">
      <path d="{{ pointerPath }}" stroke="#C8A24C" stroke-width="1.5" stroke-dasharray="3 4" fill="none"></path>
    </svg>

    <img src="{{ hwiPose }}" alt="서휘" style="{{ hwiStyle }}">
    <img src="../assets/characters/yeon/yeon-moon.webp" alt="하연" style="{{ yeonStyle }}">
    <span style="{{ reactStyle }}">{{ reaction }}</span>
  </section>

  <section onClick="{{ next }}" style="flex-grow: 1; position: relative; background: #F5F0E4; border-radius: 22px 22px 0 0; margin-top: -18px; padding: 30px 20px 18px; display: flex; flex-direction: column; gap: 12px; z-index: 2; cursor: pointer;">
    <span style="{{ nameStyle }}">{{ speakerName }}</span>
    <p style="margin: 0; font-size: 16.5px; line-height: 1.7; min-height: 84px;">{{ line }}</p>

    <div style="display: flex; gap: 6px; justify-content: center;">
      <sc-for list="{{ dots }}" as="d" hint-placeholder-count="6">
        <span style="{{ d.style }}"></span>
      </sc-for>
    </div>

    <sc-if value="{{ notLast }}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; margin-top: auto;">
        <button type="button" onClick="{{ prev }}" style="height: 52px; border-radius: 14px; border: 1px solid #D8CDB4; background: #FFFCF5; font: inherit; font-size: 14.5px; color: #1C2340; cursor: pointer;">이전</button>
        <button type="button" onClick="{{ next }}" style="height: 52px; border-radius: 14px; border: 0; background: #D4AF5A; font: inherit; font-size: 15.5px; font-weight: 700; color: #161C36; cursor: pointer;">다음 이야기</button>
      </div>
    </sc-if>

    <sc-if value="{{ isLast }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto;">
        <a href="Paywall.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #D4AF5A; color: #161C36; text-decoration: none; font-size: 16px; font-weight: 700;">종합풀이 이어서 듣기</a>
        <a href="Daily.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 14px; border: 1px solid #232B4D; color: #232B4D; text-decoration: none; font-size: 14.5px;">가입하고 오늘의 운세 무료로 받기</a>
        <button type="button" onClick="{{ restart }}" style="height: 40px; border: 0; background: transparent; font: inherit; font-size: 13.5px; color: #5B6178; cursor: pointer;">처음부터 다시 듣기</button>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
  }
  renderVals() {
    const P = {
      present: '../assets/characters/hwi-poses/04-present.webp', point: '../assets/characters/hwi-poses/03-point.webp',
      serious: '../assets/characters/hwi-poses/21-serious.webp', hide: '../assets/characters/hwi-poses/24-hide.webp',
      thumbsup: '../assets/characters/hwi-poses/02-thumbsup.webp', magnify: '../assets/characters/hwi-poses/06-magnify.webp'
    };
    const turns = [
      { who: 'hwi', pose: P.present, react: '', board: 'seal', title: '오늘의 근거 · 일간',
        line: '갑목(甲木). 양의 나무, 큰 나무야. 방향을 한번 정하면 곧게 올라가는 타입.' },
      { who: 'yeon', pose: P.hide, react: '(휘: …왜 날 봐)', board: 'chips', title: '그래서 이런 사람',
        line: '그래서 남한테 굽히는 거 진짜 싫어하죠? 휘도 똑같아요. 대신 내 사람한테는 그늘처럼 다 덮어주고~' },
      { who: 'hwi', pose: P.point, react: '', board: 'flow', title: '올해의 근거 · 십신',
        line: '올해는 병오년. 갑목한테 병화는 식신이야. 나무가 불을 피우듯, 내 안에 있던 게 밖으로 나오는 해.' },
      { who: 'yeon', pose: P.thumbsup, react: '(휘: 맞는 말)', board: 'meaning', title: '생활로 옮기면',
        line: '하고 싶은 말, 만들고 싶은 게 많아지는 해라는 거예요. 요즘 뭔가 시작하고 싶어서 근질근질했죠?' },
      { who: 'hwi', pose: P.serious, react: '', board: 'action', title: '그래서 할 일',
        line: '이번 달 안에 하나만 시작해. 크게 말고, 작게. 미루면 내가 다음 달에 물어볼 거야.' },
      { who: 'yeon', pose: P.magnify, react: '(휘: 그거 말할 거야?)', board: 'lock', title: '아직 남은 이야기',
        line: '근데 하반기에 하나 더 보이는 게 있어요. 이건 좀 따로, 천천히 얘기해야 하는데…' }
    ];
    const n = turns.length;
    const i = Math.min(this.state.i, n - 1);
    const t = turns[i];
    const isHwi = t.who === 'hwi';
    const anim = 'transition: transform 0.35s ease, opacity 0.35s ease, filter 0.35s ease; transform-origin: 50% 100%;';
    const on = 'opacity: 1; filter: drop-shadow(0 0 22px rgba(232, 205, 140, 0.6)); z-index: 1;';
    const off = 'opacity: 0.6; filter: brightness(0.7) saturate(0.8); z-index: 0;';
    return {
      progress: (i + 1) + ' / ' + n,
      line: t.line,
      boardTitle: t.title,
      isSeal: t.board === 'seal',
      isChips: t.board === 'chips',
      isFlow: t.board === 'flow',
      isMeaning: t.board === 'meaning',
      isAction: t.board === 'action',
      isLock: t.board === 'lock',
      hwiPose: t.pose,
      hwiStyle: 'position: absolute; left: 4px; bottom: 30px; width: 196px; height: 196px; ' + anim + (isHwi ? on + ' transform: translateX(8px) scale(1.06);' : off + ' transform: scale(0.8);'),
      yeonStyle: 'position: absolute; right: 4px; bottom: 30px; width: 196px; height: 196px; ' + anim + (isHwi ? off + ' transform: scale(0.8);' : on + ' transform: translateX(-8px) scale(1.06);'),
      pointerStyle: 'position: absolute; left: 45px; top: 146px; z-index: 1;',
      pointerPath: isHwi ? 'M60 38 C 70 20, 110 10, 140 2' : 'M240 38 C 230 20, 190 10, 160 2',
      reaction: t.react,
      reactStyle: 'position: absolute; left: 14px; bottom: 34px; font-size: 12px; padding: 4px 10px; border-radius: 99px; background: rgba(255, 252, 245, 0.95); color: #1C2340; z-index: 2; ' + (t.react ? 'opacity: 1;' : 'opacity: 0;') + ' transition: opacity 0.3s;',
      speakerName: isHwi ? '서휘' : '하연',
      nameStyle: 'position: absolute; top: -16px; left: 20px; padding: 6px 16px; border-radius: 99px; font-family: \'Song Myung\', serif; font-size: 17px; color: #F5F0E4; border: 1.5px solid #C8A24C; background: ' + (isHwi ? '#232B4D' : '#2C6866') + ';',
      dots: turns.map((_, k) => ({ style: 'width: ' + (k === i ? '18px' : '6px') + '; height: 6px; border-radius: 3px; background: ' + (k <= i ? '#C8A24C' : '#D8CDB4') + '; transition: width 0.3s;' })),
      notLast: i < n - 1,
      isLast: i === n - 1,
      next: () => this.setState({ i: Math.min(this.state.i + 1, n - 1) }),
      prev: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ i: Math.max(this.state.i - 1, 0) }); },
      restart: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ i: 0 }); }
    };
  }
}
</script>
</body>
</html>
