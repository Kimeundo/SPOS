<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>버스견적 뚝딱</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#153d39;--muted:#6f7d7b;--accent:#0f766e;--accent2:#dff3ef;--line:#dde6e4;--danger:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#1f2928}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand h1{font-size:24px;margin:0;color:var(--ink)}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}.pill{font-size:12px;background:var(--accent2);color:var(--accent);padding:6px 9px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 16px rgba(18,54,50,.04)}
.card h2{font-size:17px;margin:0 0 12px;color:var(--ink)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:8px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;background:#fff}.field textarea{min-height:72px;resize:vertical}.item{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}.item:first-of-type{border-top:0;padding-top:0;margin-top:0}.row-actions{display:flex;gap:8px;margin-top:10px}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:700;font-size:14px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff}.btn.soft{background:#eef4f2;color:var(--ink)}.btn.danger{background:#fff1f0;color:var(--danger)}.btn.full{width:100%}
.summary{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.08)}.summary-inner{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}.sumBox{background:#f4faf8;border-radius:12px;padding:9px 11px}.sumBox b{display:block;color:var(--ink);font-size:16px}.sumBox span{font-size:11px;color:var(--muted)}
.preview{display:none}.preview.active{display:block}.editor.hidden{display:none}.quote-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.quote-title{font-size:22px;font-weight:800;color:var(--ink)}.quote-meta{font-size:13px;color:var(--muted);line-height:1.5}.quote-table{width:100%;border-collapse:collapse;margin-top:12px}.quote-table th,.quote-table td{border-bottom:1px solid var(--line);padding:10px 4px;text-align:left;font-size:14px}.quote-table th:last-child,.quote-table td:last-child{text-align:right}.quote-total{margin-top:14px;background:#eff8f6;border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center}.quote-total strong{font-size:22px;color:var(--accent)}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}.grid3 .wide{grid-column:1/-1}.summary-inner{grid-template-columns:1fr 1fr}.summary-inner .btn{grid-column:1/-1}.brand h1{font-size:22px}}
@media print{body{background:#fff}.editor,.summary,.top .pill,.preview-actions{display:none!important}.preview{display:block!important}.wrap{max-width:none;padding:0}.card{box-shadow:none;border:none;padding:0}.quote-table th,.quote-table td{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><h1>버스견적 뚝딱</h1><p>관광버스 기사님용 초간단 모바일 견적서</p></div><div class="pill">자동계산</div></div>
  <section class="editor" id="editor">
    <div class="card"><h2>1. 기본정보</h2><div class="grid2"><div class="field"><label>견적명</label><input id="title" placeholder="예: 여수 1박2일 단체여행"></div><div class="field"><label>총 인원</label><input id="people" type="number" min="1" value="20"></div></div><div class="grid2" style="margin-top:10px"><div class="field"><label>버스비</label><input id="bus" type="number" min="0" value="0" placeholder="원"></div><div class="field"><label>기사/업체명</label><input id="seller" placeholder="예: OO관광"></div></div></div>
    <div class="card"><h2>2. 숙박</h2><div id="lodgings"></div><button class="btn soft full" id="addLodgingBtn">+ 객실 추가</button></div>
    <div class="card"><h2>3. 식사</h2><div id="meals"></div><button class="btn soft full" id="addMealBtn">+ 식사 추가</button></div>
    <div class="card"><h2>4. 관광지</h2><div id="spots"></div><button class="btn soft full" id="addSpotBtn">+ 관광지 추가</button></div>
    <div class="card"><h2>5. 메모</h2><div class="field"><textarea id="memo" placeholder="포함/불포함 사항, 출발지, 결제조건 등"></textarea></div></div>
    <div class="card"><div class="grid2"><button class="btn soft" id="saveBtn">기기에 저장</button><button class="btn primary" id="previewBtn">고객용 견적 보기</button></div></div>
  </section>
  <section class="preview" id="preview"><div class="card"><div class="quote-head"><div><div class="quote-title" id="pTitle">여행 견적서</div><div class="quote-meta" id="pMeta"></div></div><div class="quote-meta" id="pSeller"></div></div><table class="quote-table"><thead><tr><th>구분</th><th>내용</th><th>금액</th></tr></thead><tbody id="pRows"></tbody></table><div class="quote-total"><span>총 견적금액</span><strong id="pTotal">0원</strong></div><div class="quote-total" style="margin-top:8px"><span>1인당 금액</span><strong id="pPer">0원</strong></div><div id="pMemo" class="quote-meta" style="margin-top:14px"></div></div><div class="preview-actions grid2"><button class="btn soft" id="editBtn">수정하기</button><button class="btn primary" id="shareBtn">링크 공유</button><button class="btn soft" id="printBtn">인쇄/PDF</button><button class="btn soft" id="copyBtn">내용 복사</button></div></section>
</div>
<div class="summary"><div class="summary-inner"><div class="sumBox"><span>총액</span><b id="sumTotal">0원</b></div><div class="sumBox"><span>1인당</span><b id="sumPer">0원</b></div><button class="btn primary" id="finishBtn">견적 완성</button></div></div>
<script>
const $=s=>document.querySelector(s), fmt=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';
function lodgingTemplate(v={}){return `<div class="item lodging"><div class="grid3"><div class="field wide"><label>숙소명</label><input class="name" value="${v.name||''}" placeholder="예: 여수 호텔"></div><div class="field"><label>객실 형태</label><input class="type" value="${v.type||'2인1실'}"></div><div class="field"><label>객실 수</label><input class="qty" type="number" min="0" value="${v.qty||0}"></div><div class="field"><label>객실당 요금</label><input class="price" type="number" min="0" value="${v.price||0}"></div><div class="field"><label>숙박일</label><input class="days" type="number" min="1" value="${v.days||1}"></div></div><div class="row-actions"><button class="btn danger removeBtn">삭제</button></div></div>`}
function mealTemplate(v={}){return `<div class="item meal"><div class="grid3"><div class="field wide"><label>식당명</label><input class="name" value="${v.name||''}" placeholder="예: 바다식당"></div><div class="field"><label>메뉴</label><input class="menu" value="${v.menu||''}" placeholder="예: 갈치조림"></div><div class="field"><label>1인 단가</label><input class="price" type="number" min="0" value="${v.price||0}"></div><div class="field"><label>이용 인원</label><input class="qty" type="number" min="0" value="${v.qty||$('#people').value||20}"></div></div><div class="row-actions"><button class="btn danger removeBtn">삭제</button></div></div>`}
function spotTemplate(v={}){return `<div class="item spot"><div class="grid3"><div class="field wide"><label>관광지명</label><input class="name" value="${v.name||''}" placeholder="예: 미남크루즈"></div><div class="field"><label>1인 입장료</label><input class="price" type="number" min="0" value="${v.price||0}"></div><div class="field"><label>이용 인원</label><input class="qty" type="number" min="0" value="${v.qty||$('#people').value||20}"></div></div><div class="row-actions"><button class="btn danger removeBtn">삭제</button></div></div>`}
function bindDynamic(){document.querySelectorAll('input,textarea').forEach(e=>e.oninput=calc);document.querySelectorAll('.removeBtn').forEach(b=>b.onclick=()=>{b.closest('.item').remove();calc()});calc()}
function addLodging(v){$('#lodgings').insertAdjacentHTML('beforeend',lodgingTemplate(v));bindDynamic()}
function addMeal(v){$('#meals').insertAdjacentHTML('beforeend',mealTemplate(v));bindDynamic()}
function addSpot(v){$('#spots').insertAdjacentHTML('beforeend',spotTemplate(v));bindDynamic()}
function data(){return {title:$('#title').value,people:+$('#people').value||0,bus:+$('#bus').value||0,seller:$('#seller').value,memo:$('#memo').value,lodgings:[...document.querySelectorAll('.lodging')].map(x=>({name:x.querySelector('.name').value,type:x.querySelector('.type').value,qty:+x.querySelector('.qty').value||0,price:+x.querySelector('.price').value||0,days:+x.querySelector('.days').value||1})),meals:[...document.querySelectorAll('.meal')].map(x=>({name:x.querySelector('.name').value,menu:x.querySelector('.menu').value,price:+x.querySelector('.price').value||0,qty:+x.querySelector('.qty').value||0})),spots:[...document.querySelectorAll('.spot')].map(x=>({name:x.querySelector('.name').value,price:+x.querySelector('.price').value||0,qty:+x.querySelector('.qty').value||0}))}}
function total(d=data()){return d.bus+d.lodgings.reduce((s,x)=>s+x.qty*x.price*x.days,0)+d.meals.reduce((s,x)=>s+x.qty*x.price,0)+d.spots.reduce((s,x)=>s+x.qty*x.price,0)}
function calc(){const d=data(),t=total(d);$('#sumTotal').textContent=fmt(t);$('#sumPer').textContent=fmt(d.people?Math.ceil(t/d.people):0);try{localStorage.setItem('busQuoteDraft',JSON.stringify(d))}catch(e){}}
function encodeData(d){return btoa(unescape(encodeURIComponent(JSON.stringify(d))))}
function decodeData(s){return JSON.parse(decodeURIComponent(escape(atob(s))))}
function showPreview(){const d=data(),t=total(d);$('#pTitle').textContent=d.title||'여행 견적서';$('#pMeta').innerHTML=`인원 ${d.people}명<br>${new Date().toLocaleDateString('ko-KR')}`;$('#pSeller').textContent=d.seller||'';let rows='';if(d.bus)rows+=`<tr><td>버스</td><td>차량 운행비</td><td>${fmt(d.bus)}</td></tr>`;d.lodgings.forEach(x=>{let a=x.qty*x.price*x.days;if(a)rows+=`<tr><td>숙박</td><td>${x.name||'숙소'} · ${x.type} · ${x.qty}실 × ${x.days}박</td><td>${fmt(a)}</td></tr>`});d.meals.forEach(x=>{let a=x.qty*x.price;if(a)rows+=`<tr><td>식사</td><td>${x.name||'식당'} ${x.menu?('· '+x.menu):''} · ${x.qty}명</td><td>${fmt(a)}</td></tr>`});d.spots.forEach(x=>{let a=x.qty*x.price;if(a)rows+=`<tr><td>관광</td><td>${x.name||'관광지'} · ${x.qty}명</td><td>${fmt(a)}</td></tr>`});$('#pRows').innerHTML=rows||'<tr><td colspan="3">입력된 항목이 없습니다.</td></tr>';$('#pTotal').textContent=fmt(t);$('#pPer').textContent=fmt(d.people?Math.ceil(t/d.people):0);$('#pMemo').textContent=d.memo?('안내: '+d.memo):'';$('#editor').classList.add('hidden');$('#preview').classList.add('active');document.querySelector('.summary').style.display='none';history.replaceState(null,'','#q='+encodeURIComponent(encodeData(d)));window.scrollTo(0,0)}
function hidePreview(){$('#editor').classList.remove('hidden');$('#preview').classList.remove('active');document.querySelector('.summary').style.display='block';history.replaceState(null,'',location.pathname)}
async function shareQuote(){const url=location.href;try{if(navigator.share)await navigator.share({title:$('#pTitle').textContent,text:'여행 견적서를 확인해 주세요.',url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('견적 링크를 복사했습니다.')}else{prompt('아래 링크를 복사하세요.',url)}}catch(e){}}
async function copyQuote(){let txt=$('#pTitle').textContent+'\n총액 '+$('#pTotal').textContent+'\n1인당 '+$('#pPer').textContent+'\n'+location.href;try{if(navigator.clipboard){await navigator.clipboard.writeText(txt);alert('견적 내용을 복사했습니다.')}else{prompt('아래 내용을 복사하세요.',txt)}}catch(e){prompt('아래 내용을 복사하세요.',txt)}}
function saveDraft(){try{localStorage.setItem('busQuoteDraft',JSON.stringify(data()));alert('이 휴대폰에 저장했습니다.')}catch(e){alert('브라우저 저장 기능을 사용할 수 없습니다.')}}
function load(d){$('#title').value=d.title||'';$('#people').value=d.people||20;$('#bus').value=d.bus||0;$('#seller').value=d.seller||'';$('#memo').value=d.memo||'';$('#lodgings').innerHTML='';$('#meals').innerHTML='';$('#spots').innerHTML='';(d.lodgings||[]).forEach(addLodging);(d.meals||[]).forEach(addMeal);(d.spots||[]).forEach(addSpot);if(!(d.lodgings||[]).length)addLodging();if(!(d.meals||[]).length)addMeal();if(!(d.spots||[]).length)addSpot();bindDynamic()}
$('#addLodgingBtn').onclick=()=>addLodging();$('#addMealBtn').onclick=()=>addMeal();$('#addSpotBtn').onclick=()=>addSpot();$('#saveBtn').onclick=saveDraft;$('#previewBtn').onclick=showPreview;$('#finishBtn').onclick=showPreview;$('#editBtn').onclick=hidePreview;$('#shareBtn').onclick=shareQuote;$('#printBtn').onclick=()=>window.print();$('#copyBtn').onclick=copyQuote;
try{if(location.hash.startsWith('#q=')){let d=decodeData(decodeURIComponent(location.hash.slice(3)));load(d);showPreview()}else{let s='';try{s=localStorage.getItem('busQuoteDraft')||''}catch(e){};if(s)load(JSON.parse(s));else{addLodging();addMeal();addSpot();bindDynamic()}}}catch(e){$('#lodgings').innerHTML='';$('#meals').innerHTML='';$('#spots').innerHTML='';addLodging();addMeal();addSpot();bindDynamic()}
</script>
</body></html>
