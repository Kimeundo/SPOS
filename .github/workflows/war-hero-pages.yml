# 전쟁히어로를 GitHub Pages 로 배포한다 → https://kimeundo.github.io/SPOS/
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 설정.
name: 전쟁히어로 배포

on:
  push:
    branches: [main]
    paths: ['war-hero/**', '.github/workflows/war-hero-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 사이트 파일 모으기
        run: |
          mkdir _site
          cp -r war-hero/index.html war-hero/game.js war-hero/config.js war-hero/data war-hero/tiles _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
